<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                Another Nightmare - Criado por Matheus "Radish"
            </div>
            <div class="card-body" id = "tela" style="background-image: url('assets/Muspelheim.jpg');
                background-size: cover;">

                <div class="row">
                    <div class="col">
                        <ul class="list-group float-end text-center" style="width: 225px;">
                            <li class="list-group-item"><strong id="NightShift"></strong></li>
                            <li id="titulo-hero" class="list-group-item"></li>
                            <li class="list-group-item">
                                ❤️
                                <progress id="hp-hero" value="100" max="100" style="accent-color: red;"></progress>
                            </li>
                            <li class="list-group-item">
                                🧪
                                <progress id="mp-hero" value="100" max="100" style="accent-color: blue;"></progress>
                            </li>
                            <li class="list-group-item">
                                ⚡
                                <progress id="en-hero" value="80" max="100" style="accent-color: orange;"></progress>
                            </li>
                        </ul>
                    </div>

                    <div class=" col">

                        <ul class="list-group float-start text-center" style="width: 225px;">
                            <li class="list-group-item"><strong id="DoomStone"></strong></li>
                            <li id="titulo-boss" class="list-group-item">Herdeiro de Medusa</li>
                            <li class="list-group-item">
                                ❤️
                                <progress id="hp-boss" value="80" max="100" style="accent-color: red;"></progress>
                            </li>
                            <li class="list-group-item">
                                🧪
                                <progress value="100" max="100" style="accent-color: blue;"></progress>
                            </li>
                            <li class="list-group-item">
                                ⚡
                                <progress id="en-boss" value="50" max="100" style="accent-color: orange;"></progress>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="row ">
                    <div class="col text-end">
                        <img src="assets/NightShift.gif" width="300px" height="300px" />
                        <div id="controles"></div>
                    </div>
                    <div class="col">
                        <img src="assets/DoomStone.gif" width="300px" height="300px">
                    </div>
                </div>

                <div class=" card-footer text-center">
                    <small class="" text-muted>Roll with the Punches</small>
                    <p></p>
                    <small class="" text-muted>Stoney Stare</small>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="javascrpt.js"></script>

</html>
